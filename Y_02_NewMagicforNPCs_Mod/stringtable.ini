ITEMDESC_It_Spell_SummonFireGolem=The hero summons a Firegolem to help him in battle.;;L'eroe evoca un Firegolem per aiutarlo in combattimento.;;Le héros invoque un Firegolem pour l'aider au combat.;;Der Held beschwört einen Feuergolem, der ihm im Kampf zur Seite steht.;;El héroe invoca a un Firegolem para que le ayude en la batalla.;;Hrdina přivolá ohnivého golema, aby mu pomohl v boji.;;A hős megidéz egy Firegolemet, hogy segítsen neki a harcban.;;Bohater przywołuje ognistego golema, który pomaga mu w walce.;;Герой вызывает огненного голема, чтобы тот помог ему в бою.;;召喚一個火焰魔像協助英雄戰鬥。;
ITEMDESC_It_Spell_SummonIceGolem=The hero summons a Icegolem to help him in battle.;;L'eroe evoca un Icegolem per aiutarlo in battaglia.;;Le héros invoque un golem de glace pour l'aider au combat.;;Der Held beschwört einen Eisgolem, der ihm im Kampf zur Seite steht.;;El héroe invoca a un Icegolem para que le ayude en la batalla.;;Hrdina přivolá Icegolema, aby mu pomohl v boji.;;A hős megidéz egy Icegolemet, hogy segítsen neki a harcban.;;Bohater przywołuje lodowego golema, który pomaga mu w walce.;;Герой призывает ледяного голема, чтобы тот помог ему в бою.;;召喚一個冰魔像協助英雄戰鬥。;
ITEMDESC_It_Spell_IceBlock=If this Projectile hits and Enemy, he gets frozen for 60 seconds!;;Se questo proiettile colpisce un nemico, lo congela per 60 secondi!;;Si ce projectile touche un ennemi, il est gelé pendant 60 secondes !;;Wenn dieses Geschoss einen Gegner trifft, wird er für 60 Sekunden eingefroren!;;Si este proyectil alcanza a un enemigo, ¡lo congela durante 60 segundos!;;Pokud tento projektil zasáhne nepřítele, zamrzne na 60 sekund!;;Ha ez a lövedék eltalál egy ellenséget, az 60 másodpercre megfagy!;;Gdy ten czar trafi wroga, zamrozi wroga na 60 sekund!;;Если этот снаряд попадет во врага, он будет заморожен на 60 секунд!;;擊中敵人後，使其凍結 60 秒！;
